services:
  # 1. Base de datos local SQLite compartida por la app de escritorio (Avalonia UI)
  pos-db-sync:
    image: alpine:latest
    container_name: pos-db-sync
    volumes:
      - ./data:/app/data

  # 2. Servidor TCP simulador de Impresora Térmica Epson / Cajón Monedero (Puerto 9100)
  thermal-printer-emulator:
    build:
      context: ./emulator/printer
    container_name: thermal-printer-emulator
    ports:
      - "9100:9100"
    environment:
      - LOG_LEVEL=debug
      - PRINTER_PORT=9100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost',9100)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Emulador de Balanza CAS SW-20RS vía TCP (Puerto 9101)
  serial-scale-emulator:
    build:
      context: ./emulator/scale
    container_name: serial-scale-emulator
    ports:
      - "9101:9101"
    environment:
      - SCALE_MODEL=CAS-SW20RS
      - SCALE_PORT=9101
      - WEIGHT_STEP_SECONDS=3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost',9101)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. Mock API para Canales de Delivery (Rappi / Uber Eats), Pasarelas de Pago y sink del Outbox
  #    POST /webhook (Outbox sync) | GET /webhook o /events (últimos 100 eventos)
  delivery-webhook-mock:
    build:
      context: ./emulator/webhook
    container_name: delivery-webhook-mock
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Probabilidad 0..1 de responder 500 para probar los reintentos del Outbox
      - WEBHOOK_FAIL_RATE=${WEBHOOK_FAIL_RATE:-0}
      # Si se define, exige "Authorization: Bearer <clave>" en POST /webhook (401 sin ella)
      - WEBHOOK_API_KEY=${WEBHOOK_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 5. Emulador de Datáfono semi-integrado (JSON por líneas sobre TCP, Puerto 9102)
  #    Protocolo y reglas de monto (…99 rechazada, …98 no responde, …97 error) en emulator/payterminal/README.md
  payment-terminal-emulator:
    build:
      context: ./emulator/payterminal
    container_name: payment-terminal-emulator
    ports:
      - "9102:9102"
    environment:
      - TERMINAL_PORT=9102
      # Segundos entre "Acerque la tarjeta" y la respuesta (simula el tap de la tarjeta)
      - TERMINAL_DELAY_SECONDS=${TERMINAL_DELAY_SECONDS:-3}
      # Probabilidad 0..1 de rechazo aleatorio para montos que normalmente se aprueban
      - TERMINAL_DECLINE_RATE=${TERMINAL_DECLINE_RATE:-0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',9102)); s.sendall(b'{\"op\":\"ping\"}'+bytes([10])); assert b'pong' in s.recv(64); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
